<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="css/all.min.css" />

    <link rel="stylesheet" href="css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>snaik snake</title>
  </head>
  <body class="flex items-center justify-center">
    <div class="container rounded-md flex flex-col overflow-hidden">
      <div
        class="game-detailes text-base font-medium flex justify-between text-slate-400"
      >
        <span class="score">Score: 0</span>
        <span class="high-score">High Score: 0</span>
      </div>
      <div class="play-ground w-full h-full"></div>
      <div class="controls">
        <i data-key="ArrowUp" class="fa-solid fa-arrow-up"></i>
        <i data-key="ArrowDown" class="fa-solid fa-arrow-down"></i>
        <i data-key="Arrowleft" class="fa-solid fa-arrow-left"></i>
        <i data-key="ArrowRight" class="fa-solid fa-arrow-right"></i>
      </div>
    </div>

    <script src="main.js" defer></script>
  </body>
</html>
