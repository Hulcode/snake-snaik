<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Snake Game</title>
    <style>
      /* Prevent touch highlight on buttons */
      * {
        -webkit-tap-highlight-color: transparent;
      }

      /* Prevent text selection */
      * {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body class="flex items-center justify-center">
    <div class="container rounded-md flex flex-col overflow-hidden">
      <div
        class="game-details text-base font-medium flex justify-between text-slate-400"
      >
        <span class="score">Score: 0</span>
        <span class="high-score">High Score: 0</span>
      </div>
      <div class="play-ground w-full h-full"></div>
      <div class="controls">
        <i data-key="ArrowUp" class="fa-solid fa-arrow-up"></i>
        <i data-key="ArrowDown" class="fa-solid fa-arrow-down"></i>
        <i data-key="ArrowLeft" class="fa-solid fa-arrow-left"></i>
        <i data-key="ArrowRight" class="fa-solid fa-arrow-right"></i>
      </div>
    </div>

    <script src="main.js" defer></script>
  </body>
</html>
